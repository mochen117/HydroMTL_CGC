# ==============================================================================
# Configuration File for HydroMTL_CGC Framework
# Description:
#   Defines data settings, model architecture, optimization parameters, and
#   evaluation protocol for streamflow-ET multi-task learning experiments.
#   This configuration follows the HydroMTL hard-sharing benchmark protocol
#   as closely as possible while replacing the backbone with CGC routing.
# ==============================================================================

experiment:
  name: "cgc_hydro_baseline"
  task: "streamflow_et_prediction"
  timestamp: null
  save_dir: "./experiments"

data:
  dataset: "CAMELS_US_custom"
  data_root: "/home/mochen/code/HydroMTL_CGC/output_592_basins"
  basin_metadata_path: "/home/mochen/code/HydroMTL_CGC/data/basin_metadata.csv"
  show_loading_progress: true
  basin_list_path: null

  static_features:
    # Terrain
    - "elev_mean"
    - "slope_mean"
    - "area_gages2"

    # Land cover
    - "frac_forest"
    - "lai_max"
    - "lai_diff"
    - "dom_land_cover_frac"
    - "root_depth_50"

    # Soil physical properties
    - "soil_depth_statgso"
    - "soil_porosity"
    - "soil_conductivity"
    - "max_water_content"

    # Geology
    - "geol_porosity"
    - "geol_permeability"

    # Climate
    - "p_mean"
    - "pet_mean"
    - "aridity"
    - "p_seasonality"
    - "frac_snow"

    # Soil texture
    - "sand_frac"
    - "clay_frac"
    - "organic_frac"

    # Additional geology
    - "carbonate_rocks_frac"

  categorical_static_features:
    - "dom_land_cover"
    - "geol_class_1st"
    - "geol_class_2nd"
    - "huc_02"

  categorical_num_classes:
    dom_land_cover: 20
    geol_class_1st: 20
    geol_class_2nd: 20
    huc_02: 20

  categorical_embed_dims:
    dom_land_cover: 6
    geol_class_1st: 8
    geol_class_2nd: 8
    huc_02: 12

  dynamic_features:
    - "total_precipitation"
    - "temperature"
    - "specific_humidity"
    - "shortwave_radiation"
    - "potential_energy"

  targets:
    - name: "streamflow"
      type: "regression"
      loss_weight: 1.0
      constraint: "non_negative"

    - name: "evapotranspiration"
      type: "regression"
      loss_weight: 0.1
      constraint: "non_negative"

  sequence_length: 365
  prediction_horizon: 1
  forecast_history: 365

  train_period: ["2001-10-01", "2011-09-30"]
  val_period: ["2011-10-01", "2016-09-30"]
  test_period: ["2016-10-01", "2021-09-30"]

  spatial_split: false
  spatial_split_type: "none"

  normalize: true
  fill_missing: true
  causal_dynamic_imputation: true

  batch_size: 64
  num_workers: 0
  pin_memory: false


model:
  architecture: "cgc"

  cgc:
    shared_experts: 4
    task_experts: [4, 4]
    expert_hidden_dim: 256
    use_attention_gate: true
    temperature: 1.0
    dropout_rate: 0.1

  encoder:
    type: "lstm"
    hidden_dim: 64
    num_layers: 2
    bidirectional: false

  task_towers:
    - type: "mlp"
      hidden_dim: 128
      num_layers: 2
      output_head: "regression"

    - type: "mlp"
      hidden_dim: 128
      num_layers: 2
      output_head: "regression"

  physics_constraints:
    water_balance:
      enabled: false
      alpha: 0.1
      requires_precipitation: true

training:
  optimizer: "adamw"
  learning_rate: 0.001
  weight_decay: 0.0001
  clip_grad_norm: 1.0
  use_amp: true
  batch_progress: false

  loss:
    base_loss: "rmse"
    multi_task_balancing: "none"
    water_balance_weight: 0.0
    eps: 1.0e-6

  monitor:
    # Shared validation monitor used by scheduler, checkpoint, and early stopping.
    # Use joint_nse for balanced Q-ET model selection; use a task-specific NSE
    # monitor for target-variable transfer experiments.
    name: "joint_nse"
    mode: "max"
    min_delta: 1.0e-4

  scheduler:
    type: "reduce_on_plateau"
    mode: "max"
    factor: 0.5
    patience: 8
    min_lr: 1.0e-6

  epochs: 300
  warmup_epochs: 0

  early_stopping:
    enabled: true
    patience: 40
    min_delta: 1.0e-4

  diagnostics:
    enabled: true
    epoch_interval: 1
    gradient_batches_per_epoch: 5
    fail_on_error: false

  dropout: 0.1
  batch_norm: true

  save_frequency: 10
  save_best_only: true

evaluation_protocol:
  metrics:
    - "nse"
    - "kge"
    - "rmse"
    - "mae"
    - "bias"
    - "corr"
  primary_metric: "streamflow_nse_median"
  save_top_k: 3

experiment_tracking:
  save_predictions: true
  save_gate_weights: true
  save_per_basin_metrics: true

reproducibility:
  deterministic: true
  seed: 42

logging:
  level: "INFO"
  tensorboard: true
  wandb: false
  console: true
  file: true