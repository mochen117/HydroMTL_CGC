# ==============================================================================
# Configuration File for HydroMTL_CGC Framework
# Description: Defines hyper-parameters, data splits, and model architectures.
# Adapted for Large-Sample Hydrological Modeling (e.g., CAMELS datasets).
# ==============================================================================

experiment:
  name: "cgc_hydro_experiment_001"
  task: "streamflow_et_prediction"
  timestamp: null
  save_dir: "./experiments"

data:
  dataset: "CAMELS_US_custom"
  data_root: "./output_592_basins"

  # Numerical static features (will be standardized)
  static_features:
    # Terrain
    - "elev_mean"
    - "slope_mean"
    - "area_gages2"
    # Land Cover
    - "frac_forest"
    - "lai_max"
    - "lai_diff"
    - "dom_land_cover_frac"
    - "root_depth_50"
    # Soil Group (physical properties)
    - "soil_depth_statgso"
    - "soil_porosity"
    - "soil_conductivity"
    - "max_water_content"
    # Geology
    - "geol_porosity"
    - "geol_permeability"
    # Climate
    - "p_mean"
    - "pet_mean"
    - "aridity"
    - "p_seasonality"
    - "frac_snow"
    # Soil Group (texture)
    - "sand_frac"
    - "clay_frac"
    - "organic_frac"
    # Geology additional
    - "carbonate_rocks_frac"

  # Categorical static features (will be embedded)
  categorical_static_features:
    - "dom_land_cover"
    - "geol_class_1st"
    - "geol_class_2nd"
    - "huc_02"

  categorical_num_classes:
    dom_land_cover: 20
    geol_class_1st: 20
    geol_class_2nd: 20
    huc_02: 20

  categorical_embed_dims:
    dom_land_cover: 6
    geol_class_1st: 8
    geol_class_2nd: 8
    huc_02: 12

  # Dynamic meteorological forcing features
  dynamic_features:
    - "total_precipitation"
    - "temperature"
    - "specific_humidity"
    - "shortwave_radiation"
    - "potential_energy"

  targets:
    - name: "streamflow"
      type: "regression"
      loss_weight: 1.0
      constraint: "non_negative"
    - name: "evapotranspiration"
      type: "regression"
      loss_weight: 0.33
      constraint: "non_negative"

  # Sequence and forecasting settings
  sequence_length: 365
  prediction_horizon: 1
  forecast_history: 365

  # Temporal split for train/valid/test
  train_period: ["2001-10-01", "2011-09-30"]
  val_period: ["2011-10-01", "2016-09-30"]
  test_period: ["2016-10-01", "2021-09-30"]
  train_ratio: 0.7
  val_ratio: 0.15

  normalize: true
  fill_missing: true
  batch_size: 100
  num_workers: 4
  prefetch_factor: 2

model:
  cgc:
    shared_experts: 4
    task_experts: [4, 2]
    expert_hidden_dim: 256
    use_attention_gate: true
    dropout_rate: 0.3

  encoder:
    type: "lstm"
    hidden_dim: 256
    num_layers: 2
    bidirectional: false

  task_towers:
    - type: "mlp"
      hidden_dim: 128
      num_layers: 2
      output_head: "regression"
    - type: "mlp"
      hidden_dim: 128
      num_layers: 2
      output_head: "regression"

  physics_constraints:
    water_balance:
      enabled: false
      alpha: 0.1
      requires_precipitation: true

training:
  optimizer: "adamw"
  learning_rate: 0.001
  weight_decay: 0.05
  clip_grad_norm: 1.0

  loss:
    base_loss: "rmse"
    multi_task_balancing: "none"
    water_balance_weight: 0

  scheduler:
    type: "reduce_on_plateau"
    mode: "min"
    factor: 0.5
    patience: 5
    min_lr: 1e-6

  epochs: 300
  warmup_epochs: 0
  
  early_stopping:
    enabled: true
    patience: 15     
    min_delta: 1e-4

  dropout: 0.5
  batch_norm: true

  save_frequency: 10
  save_best_only: true

evaluation:
  metrics:
    - "nse"
    - "kge"
    - "rmse"
    - "mae"
    - "bias"
    - "corr"

  plot_predictions: true
  save_figures: true
  confidence_intervals: true

logging:
  level: "INFO"
  tensorboard: true
  wandb: false
  console: true
  file: true